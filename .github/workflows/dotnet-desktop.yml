name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.read_version.outputs.current_version }}
      version_changed: ${{ steps.compare_versions.outputs.version_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Current Version
        id: read_version
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/PokeBot.cs | sed 's/.*Version = "\(.*\)";/\1/')
          echo "Current version is $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
      - name: Compare Versions
        id: compare_versions
        run: |
          CURRENT_VERSION=${{ env.CURRENT_VERSION }}
          echo "Current version: $CURRENT_VERSION"
          if git rev-parse "$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists."
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "New release tag detected."
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: windows-latest
    env:
      Project_Name: SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore ${{ env.Project_Name }} --runtime win-x86
      - name: Test updater control panel
        run: node --test SysBot.Pokemon.WinForms/Resources/BotControlPanel.test.cjs
      - name: Build
        run: dotnet build ${{ env.Project_Name }} --configuration Release --no-restore -m:1 -nr:false
      - name: Publish
        run: dotnet publish ${{ env.Project_Name }} --configuration Release --output ./publish --no-restore /p:PublishSingleFile=true /p:SelfContained=false /p:RuntimeIdentifier=win-x86
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeBot
          path: ./publish

  create-release:
    needs: [version-check, build]
    if: github.event_name == 'push' && needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Current Version
        id: read_version
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/PokeBot.cs | sed 's/.*Version = "\(.*\)";/\1/')
          echo "Current version is $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: PokeBot
          path: ./publish
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.CURRENT_VERSION }}" ./publish/PokeBot.exe \
            --title "Release ${{ env.CURRENT_VERSION }}" \
            --generate-notes
